version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: georisk_postgres_prod
    environment:
      POSTGRES_DB: georisk_db
      POSTGRES_USER: georisk_prod
      POSTGRES_PASSWORD: georisk_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georisk_prod -d georisk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: georisk_redis_prod
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: georisk_backend_prod
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://georisk_prod:georisk_secure_password_2026@postgres:5432/georisk_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: georisk_production_jwt_secret_key_2026_super_secure
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: georisk_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
